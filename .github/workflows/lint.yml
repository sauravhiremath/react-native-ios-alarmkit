name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint-ci

      - name: Run TypeScript type check
        run: bun run typecheck

      - name: Run action event API tests
        run: node --test tests/alarm-action-events.test.cjs

  swift-tests:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check that the iPhone Simulator SDK provides AlarmKit
        run: |
          cat > "$RUNNER_TEMP/AlarmKitProbe.swift" <<'EOF'
          #if !canImport(AlarmKit) || !canImport(AppIntents)
          #error("The iPhone Simulator SDK does not provide AlarmKit and AppIntents")
          #endif
          EOF
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios15.1-simulator "$RUNNER_TEMP/AlarmKitProbe.swift"

      - name: Type check iOS action intents
        run: xcrun swiftc -typecheck -strict-concurrency=complete -warnings-as-errors -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios15.1-simulator ios/AlarmActionEventStore.swift ios/AlarmActionTracking.swift ios/AlarmActionIntents.swift

      - name: Compile action event tests
        run: swiftc -parse-as-library -strict-concurrency=complete -warnings-as-errors ios/AlarmActionEventStore.swift ios/AlarmActionTracking.swift tests/swift/TestRunner.swift tests/swift/AlarmActionTrackingTests.swift tests/swift/AlarmActionEventStoreTests.swift -o "$RUNNER_TEMP/alarm-action-event-tests"

      - name: Run action event tests
        run: '"$RUNNER_TEMP/alarm-action-event-tests"'
